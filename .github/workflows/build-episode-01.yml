name: Build episode 01

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Generate AI narration and scene backgrounds (when API keys are configured)
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}
          FISH_MODEL: s2.1-pro-free
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          if [ -n "$FISH_API_KEY" ] && [ -n "$FAL_KEY" ]; then
            npm run generate:assets
            echo "AI_MEDIA_READY=true" >> "$GITHUB_ENV"
          else
            echo "AI_MEDIA_READY=false" >> "$GITHUB_ENV"
            echo "AI provider secrets are not configured; rendering the built-in SVG fallback."
          fi

      - name: Render full episode
        run: |
          if [ "$AI_MEDIA_READY" = "true" ]; then
            npm run render:ai
          else
            npm run render:ci
          fi

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: chuzhaya-parta-episode-01
          path: out/episode-01.mp4
          if-no-files-found: error
          retention-days: 14
