name: Build episode 01

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Install speech engines
        run: |
          python -m pip install --upgrade edge-tts gTTS
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Generate Russian narration and optional AI backgrounds
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}
          FISH_MODEL: s2.1-pro-free
          EDGE_TTS_VOICE: ru-RU-DmitryNeural
          EDGE_TTS_RATE: +0%
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          npm run generate:assets
          echo "VOICEOVER_READY=true" >> "$GITHUB_ENV"
          if [ -n "$FAL_KEY" ]; then
            echo "AI_VISUALS_READY=true" >> "$GITHUB_ENV"
          else
            echo "AI_VISUALS_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Render full episode
        run: |
          if [ "$AI_VISUALS_READY" = "true" ]; then
            npm run render:ai
          else
            npx remotion render src/index.ts Episode out/episode-01.mp4 --codec=h264 --crf=20 --concurrency=2 --props='{"voiceover":true,"aiVisuals":false}'
          fi

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: chuzhaya-parta-episode-01
          path: out/episode-01.mp4
          if-no-files-found: error
          retention-days: 14
